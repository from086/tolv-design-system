<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tolv Button — demo</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="./button.css">
<style>
  body { font-family: var(--font-sans); background: var(--color-bg-basic-primary); color: var(--color-fg-basic-primary); margin: 0; padding: 24px 32px; }
  h1 { font-size: 20px; } h2 { font-size: 14px; color: var(--color-fg-basic-secondary); margin: 24px 0 8px; }
  table { border-collapse: collapse; }
  th, td { padding: 10px 14px; text-align: left; }
  th { font-size: 12px; font-weight: 500; color: var(--color-fg-basic-secondary); }
  .toolbar { position: sticky; top: 0; padding: 8px 0; background: var(--color-bg-basic-primary); }
  .toolbar button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="document.documentElement.dataset.theme='light'">Light</button>
    <button onclick="document.documentElement.dataset.theme='dark'">Dark</button>
    <button onclick="delete document.documentElement.dataset.theme">Auto(OS)</button>
  </div>
  <h1>tolv Button</h1>

  <template id="chev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

  <div id="grids"></div>

<script>
  const chev = document.getElementById('chev').innerHTML;
  const types = [['primary','Primary'],['secondary','Secondary'],['caution','Caution']];
  const states = [['','Default'],['hover','Hover (擬似:枠色)'],['disabled','Disabled']];
  const sizes = [['','Medium'],['sm','Small']];
  let html = '';
  for (const [sz, szName] of sizes) {
    html += `<h2>Size = ${szName}</h2><table><tr><th></th>` + types.map(t=>`<th>${t[1]}</th>`).join('') + '</tr>';
    for (const [st, stName] of states) {
      html += `<tr><th>${stName}</th>`;
      for (const [ty] of types) {
        const cls = ['tolv-btn', sz && 'tolv-btn--'+sz, 'tolv-btn--'+ty].filter(Boolean).join(' ');
        const dis = st === 'disabled' ? ' disabled' : '';
        html += `<td><button class="${cls}"${dis}>`
             +  `<span class="tolv-btn__icon">${chev}</span>`
             +  `<span class="tolv-btn__label">ラベル</span>`
             +  `<span class="tolv-btn__icon">${chev}</span></button></td>`;
      }
      html += '</tr>';
    }
    html += '</table>';
  }
  document.getElementById('grids').innerHTML = html;
</script>
</body>
</html>
